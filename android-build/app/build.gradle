plugins { id 'com.android.application' }

String appVariant = providers.gradleProperty("zaviApp").getOrElse("one")
if (!(appVariant in ["one", "admin"])) throw new GradleException("zaviApp must be one or admin")
boolean admin = appVariant == "admin"
int ciBuildNumber = providers.gradleProperty('zaviBuildNumber').map { it.toInteger() }.getOrElse(0)
if (ciBuildNumber < 0 || ciBuildNumber > 9999) throw new GradleException('zaviBuildNumber must be 0..9999')
// CI-only compilation check: exercise R8 without a signing key; never publish this APK.
boolean unsignedReleaseQa = providers.gradleProperty('zaviUnsignedReleaseQa').map { it == 'true' }.getOrElse(false)

// Signing secrets are supplied by CI environment variables, never stored in Git.
def releaseSigningEnv = [
    storeFile: 'ZAVI_RELEASE_STORE_FILE',
    storePassword: 'ZAVI_RELEASE_STORE_PASSWORD',
    keyAlias: 'ZAVI_RELEASE_KEY_ALIAS',
    keyPassword: 'ZAVI_RELEASE_KEY_PASSWORD'
]
def releaseSigning = releaseSigningEnv.collectEntries { field, envName ->
    [(field): providers.environmentVariable(envName).getOrElse('')]
}
// A persistent, app-specific signing key is required for any installable APK.
// Keys/passwords are private; GitHub CI must supply them via Secrets.
def qaSigningEnv = [
    storeFile: 'ZAVI_QA_STORE_FILE',
    storePassword: 'ZAVI_QA_STORE_PASSWORD',
    keyAlias: 'ZAVI_QA_KEY_ALIAS',
    keyPassword: 'ZAVI_QA_KEY_PASSWORD'
]
def qaSigning = qaSigningEnv.collectEntries { field, envName ->
    [(field): providers.environmentVariable(envName).getOrElse('')]
}
// Explicitly isolated, non-updatable test builds. Never permitted for Release or QA.
def isolatedTestEnv = [
    storeFile: 'ZAVI_ISOLATED_TEST_STORE_FILE',
    storePassword: 'ZAVI_ISOLATED_TEST_STORE_PASSWORD',
    keyAlias: 'ZAVI_ISOLATED_TEST_KEY_ALIAS',
    keyPassword: 'ZAVI_ISOLATED_TEST_KEY_PASSWORD'
]
def isolatedSigning = isolatedTestEnv.collectEntries { field, name ->
    [(field): providers.environmentVariable(name).getOrElse('')]
}
boolean isolatedSigningPresent = isolatedSigning.values().every { it }
boolean isolatedTestFlag = providers.gradleProperty('zaviIsolatedTestOnly')
    .map { it == 'true' }.getOrElse(false)
boolean installablePreviewFlag = providers.gradleProperty('zaviInstallablePreview')
    .map { it == 'true' }.getOrElse(false)
boolean qaSigningPresent = qaSigning.values().every { it }
if (!qaSigningPresent && qaSigning.values().any { it }) {
    throw new GradleException('Incomplete stable QA signing credentials; all four variables are required.')
}

android {
    namespace 'com.zavione.mobile'
    compileSdk 36
    defaultConfig {
        applicationId admin ? 'com.zavione.one.admin' : 'com.zavione.one'
        minSdk 26
        targetSdk 36
        // Explicitly advance each product's base version by one. The CI run number makes every artifact unique.
        versionCode ((admin ? 146900 : 667800) + ciBuildNumber)
        versionName ((admin ? '1.4.69-reborn.qa' : '66.78-reborn.qa') + '.' + ciBuildNumber)
        resValue 'string', 'app_name', admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'
    }
    signingConfigs {
        isolatedTestOnly {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
            if (isolatedSigningPresent) {
                storeFile file(isolatedSigning.storeFile)
                storePassword isolatedSigning.storePassword
                keyAlias isolatedSigning.keyAlias
                keyPassword isolatedSigning.keyPassword
            }
        }
        zaviQa {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
            if (qaSigningPresent) {
                storeFile file(qaSigning.storeFile)
                storePassword qaSigning.storePassword
                keyAlias qaSigning.keyAlias
                keyPassword qaSigning.keyPassword
            }
        }
        release {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
            if (releaseSigning.values().every { it }) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        // Install QA side-by-side with existing signed production apps.
        // A debug key MUST NEVER overwrite or require uninstalling accounting data.
        debug {
            applicationIdSuffix '.rebornqa'
            resValue 'string', 'app_name', admin ? 'ZAVI ONE ADMIN REBORN QA' : 'ZAVI ONE REBORN QA'
            if (qaSigningPresent) {
                if (!file(qaSigning.storeFile).isFile()) {
                    throw new GradleException('Stable QA signing keystore was configured but no file exists.')
                }
                signingConfig signingConfigs.zaviQa
            }
        }
        isolatedTestOnly {
            // Isolated from both production and stable QA signing identities.
            initWith debug
            applicationIdSuffix '.testnotforrelease'
            versionNameSuffix '-TEST-NOT-FOR-RELEASE'
            debuggable true
            resValue 'string', 'app_name',
                admin ? 'ZAVI ADMIN TEST-NOT-FOR-RELEASE' : 'ZAVI ONE TEST-NOT-FOR-RELEASE'
            if (isolatedSigningPresent) {
                signingConfig signingConfigs.isolatedTestOnly
            }
        }
        installablePreview {
            // Fresh, separately installed QA preview for phone-only testing.
            // NEVER RELEASE: temporary signature cannot upgrade a real install.
            // Staging workflow strips live cloud configuration from packaged assets.
            initWith debug
            applicationIdSuffix '.offlinepreview'
            versionNameSuffix '-OFFLINE-PREVIEW-NOT-RELEASE'
            debuggable true
            resValue 'string', 'app_name',
                admin ? 'ZAVI ADMIN OFFLINE PREVIEW' : 'ZAVI ONE OFFLINE PREVIEW'
            if (isolatedSigningPresent) {
                signingConfig signingConfigs.isolatedTestOnly
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig unsignedReleaseQa ? null : signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
// Kotlin 1.8+ merges jdk7/jdk8 stdlib classes into kotlin-stdlib.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies { implementation 'androidx.webkit:webkit:1.13.0'; implementation 'androidx.core:core:1.13.1'; implementation 'androidx.biometric:biometric:1.1.0' }

// Fail closed for ALL installable QA and Release APKs; an unsigned R8 QA
// compilation is intentionally not installable and is never distributed.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project &&
            it.name.toLowerCase() ==~ /.*(assemble|package|install|bundle).*isolatedtestonly.*/ }) {
        if (!isolatedTestFlag || System.getenv('CI') != 'true') {
            throw new GradleException('TEST-NOT-FOR-RELEASE requires isolated CI flag; production signing must remain unchanged.')
        }
        if (!isolatedSigningPresent || !file(isolatedSigning.storeFile).isFile()) {
            throw new GradleException('TEST-NOT-FOR-RELEASE requires its OWN ephemeral key; no stable QA/release fallback allowed.')
        }
    }
    if (graph.allTasks.any { it.project == project &&
            it.name.toLowerCase() ==~ /.*(assemble|package|install|bundle).*installablepreview.*/ }) {
        if (!installablePreviewFlag || System.getenv('CI') != 'true') {
            throw new GradleException('Offline mobile preview requires explicit isolated CI flag; never a Release.')
        }
        if (!isolatedSigningPresent || !file(isolatedSigning.storeFile).isFile()) {
            throw new GradleException('Offline mobile preview requires separate ephemeral signing; no production fallback.')
        }
    }
    if (graph.allTasks.any { it.project == project &&
            it.name.toLowerCase() ==~ /.*(assemble|package|install|bundle).*debug.*/ }) {
        if (!qaSigningPresent) {
            throw new GradleException('Persistent QA signing key required; ephemeral debug signing is forbidden.')
        }
        if (!file(qaSigning.storeFile).isFile()) {
            throw new GradleException('Configured persistent QA signing keystore was not found.')
        }
    }
    if (!unsignedReleaseQa && graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        def missing = releaseSigningEnv.findAll { field, envName -> !releaseSigning[field] }.values()
        if (!missing.isEmpty()) {
            throw new GradleException('Release signing is missing required environment variables: ' + missing.join(', '))
        }
        if (!file(releaseSigning.storeFile).isFile()) {
            throw new GradleException('Release keystore file does not exist at the configured path.')
        }
    }
}

name: Stage 4 cheque settlement - synthetic PostgreSQL only
on:
  push:
    branches: [dev]
    paths:
      - 'supabase/staging/20261110_stage4_cheque_atomic_settlement.sql'
      - 'scripts/test-stage4-cheque-postgres.sql'
      - 'scripts/test-stage4-cheque-concurrency.sh'
      - 'scripts/test-stage4-cheque-transaction-rollback.sql'
      - 'supabase/rollback/20261110_stage4_cheque_preuse_only.sql'
      - 'supabase/migrations/20261110_stage4_cheque_atomic_server.sql'
      - 'scripts/test-stage4-production-migration.sh'
      - 'supabase/migrations/20261110_stage4_cheque_subscription_guard.sql'
      - 'scripts/test-stage4-cheque-subscription.sql'
      - 'packages/shared/accounting/cheque-settlement-contract.js'
      - 'scripts/test-cheque-settlement.cjs'
      - '.github/workflows/stage4-cheque-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cheque-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure cheque accounting invariants
        run: node scripts/test-cheque-settlement.cjs
      - name: Validate cheque client inputs, scoped durable queue and offline safety
        run: node scripts/test-stage4-cheque-client.cjs
      - name: Prove atomic cheque staging RPC on disposable PostgreSQL 17
        env:
          PGPASSWORD: synthetic-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/test-stage4-cheque-postgres.sql
      - name: Reject cheque registration after subscription expiry
        env:
          PGPASSWORD: synthetic-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres             -v ON_ERROR_STOP=1 -f scripts/test-stage4-cheque-subscription.sql
      - name: Verify concurrent PostgreSQL connections and dropped ACK
        env:
          PGPASSWORD: synthetic-test-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
        run: bash scripts/test-stage4-cheque-concurrency.sh
      - name: Verify transactional rollback and deny direct financial changes
        env:
          PGPASSWORD: synthetic-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f scripts/test-stage4-cheque-transaction-rollback.sql
      - name: Validate production guarded DDL on disposable PostgreSQL
        env:
          PGPASSWORD: synthetic-test-only
        run: bash scripts/test-stage4-production-migration.sh
      - name: Prove pre-use rollback and refusal after financial posting
        env:
          PGPASSWORD: synthetic-test-only
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres
          # Already-used Stage 4 journal must make rollback refuse without data loss.
          if psql -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/rollback/20261110_stage4_cheque_preuse_only.sql >/tmp/stage4-refusal.log 2>&1; then
            echo "FAIL: rollback unexpectedly allowed after settlements"
            exit 1
          fi
          psql -d postgres -At -c \
            "SELECT to_regprocedure('public.zavi_stage4_cheque_apply(uuid,uuid,uuid,text,numeric,text,numeric)') IS NOT NULL" | grep -qx t
          # New disposable database with the pre-migration fixture, no customer data.
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zavi_stage4_rollback_qa'
          awk 'index($0,"\\ir ")==1{exit} !/^CREATE ROLE /{print}' \
            scripts/test-stage4-cheque-postgres.sql |
            psql -d zavi_stage4_rollback_qa -v ON_ERROR_STOP=1
          psql -d zavi_stage4_rollback_qa -v ON_ERROR_STOP=1 \
            -f supabase/staging/20261110_stage4_cheque_atomic_settlement.sql
          psql -d zavi_stage4_rollback_qa -v ON_ERROR_STOP=1 \
            -f supabase/rollback/20261110_stage4_cheque_preuse_only.sql
          psql -d zavi_stage4_rollback_qa -At -c \
            "SELECT to_regprocedure('public.zavi_stage4_cheque_apply(uuid,uuid,uuid,text,numeric,text,numeric)') IS NULL" | grep -qx t
          psql -d zavi_stage4_rollback_qa -At -c \
            "SELECT EXISTS(SELECT 1 FROM pg_constraint WHERE conname='zavi_cheque_initial_pending')" | grep -qx t
          echo 'PASS: rollback allowed only before settlement; original constraints restored'

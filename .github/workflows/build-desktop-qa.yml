name: REBORN Windows Desktop QA Installers
# Owner approval is required before ANY installable binary is built.
# Visual/contract QA workflows remain automatic; release/preview is manual only.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  windows-qa:
    name: Windows x64 QA installer (${{ matrix.app }}, unsigned)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [one, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and stage unchanged app UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'
          python scripts/check-public-source-security.py
          if ($LASTEXITCODE -ne 0) { throw 'Public source secrets check failed' }
          python scripts/check-migration-integrity.py
          if ($LASTEXITCODE -ne 0) { throw 'Source integrity check failed' }
          if (Test-Path 'desktop/windows/web') { Remove-Item 'desktop/windows/web' -Recurse -Force }
          New-Item -ItemType Directory -Force "desktop/windows/web/apps/$app" | Out-Null
          New-Item -ItemType Directory -Force 'desktop/windows/web/packages/shared' | Out-Null
          Copy-Item "apps/$app/*" "desktop/windows/web/apps/$app/" -Recurse -Force
          Copy-Item 'packages/shared/*' 'desktop/windows/web/packages/shared/' -Recurse -Force
          python scripts/stamp-desktop-qa.py --app $app --assets "desktop/windows/web/apps/$app" --run $env:GITHUB_RUN_NUMBER --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Version stamp failed' }
          python -m pip install 'Pillow==12.0.0' --disable-pip-version-check --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python -c "from PIL import Image; Image.open('apps/$app/icon-192.png').save('desktop/windows/zavi.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(192,192)])"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'desktop/windows/zavi.ico')) { throw 'Windows icon generation failed' }
      - name: Publish isolated Windows desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'
          if ($app -eq 'one') {
            $version = "66.78.$env:GITHUB_RUN_NUMBER"
            $label = "66.78-reborn.qa.$env:GITHUB_RUN_NUMBER"
            $assembly = 'ZAVI_ONE'
            $options = @()
          } elseif ($app -eq 'admin') {
            $version = "1.4.69.$env:GITHUB_RUN_NUMBER"
            $label = "1.4.69-reborn.qa.$env:GITHUB_RUN_NUMBER"
            $assembly = 'ZAVI_ONE_ADMIN'
            $options = @('-p:DefineConstants=ZAVI_ADMIN')
          } else { throw "Unexpected Windows app variant: $app" }
          dotnet publish 'desktop/windows/ZaviOneDesktop.csproj' -c Release -r win-x64 --self-contained true -o 'desktop/windows/publish' "-p:Version=$version" "-p:InformationalVersion=$label" "-p:AssemblyName=$assembly" @options
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          if (-not (Test-Path "desktop/windows/publish/$assembly.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "desktop/windows/publish/web/apps/$app/index.html")) { throw 'Packaged app UI missing' }
          if (-not (Test-Path 'desktop/windows/publish/web/packages/shared/database/supabase-config.js')) { throw 'Packaged shared module missing' }
          $stamp=Get-Content "desktop/windows/publish/web/apps/$app/zavi-build-info.json" | ConvertFrom-Json
          if ($stamp.commit -ne $env:GITHUB_SHA -or $stamp.app -ne $app -or $stamp.version -ne $label) {
            throw 'Source or version provenance mismatch in published app'
          }
          Write-Host "PASS: $app source, app identity, isolated WebView2 profile and QA provenance"
      - name: Compile Inno Setup QA installer and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = '${{ matrix.app }}'
          $iscc=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno compiler missing' }
          $env:ZAVI_DESKTOP_APP=$app
          $env:ZAVI_DESKTOP_NUMBER=$env:GITHUB_RUN_NUMBER
          $env:ZAVI_DESKTOP_LABEL=if ($app -eq 'one') {
            "66.78-reborn.qa.$env:GITHUB_RUN_NUMBER"
          } else {
            "1.4.69-reborn.qa.$env:GITHUB_RUN_NUMBER"
          }
          & $iscc 'desktop/windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno compiler failed' }
          $base = if ($app -eq 'one') { 'ZAVI_ONE_REBORN' } else { 'ZAVI_ONE_ADMIN_REBORN' }
          $name = $base + '_Windows_QA_' + $env:GITHUB_RUN_NUMBER + '.exe'
          $installer = Join-Path 'desktop/windows/output' $name
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 102400) {
            throw 'Expected installer missing or too small'
          }
          $digest=(Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$digest  $name" | Set-Content -Encoding ascii 'desktop/windows/output/SHA256SUMS.txt'
          Write-Host "PASS: $app QA Windows installer SHA-256 $digest"
          Write-Host '::warning::Unsigned QA installer. Not production or SmartScreen certified.'
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI-REBORN-WINDOWS-QA-${{ matrix.app }}
          path: |
            desktop/windows/output/*.exe
            desktop/windows/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

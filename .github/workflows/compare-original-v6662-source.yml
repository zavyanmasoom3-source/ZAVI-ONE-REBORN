name: Compare exact 66.62 APK assets with current ONE source
on:
  push:
    branches: [dev]
    paths: [".github/workflows/compare-original-v6662-source.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download original exact signed-source APK (read only)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/old.apk \
            https://github.com/zavyanmasoom3-source/Zavione/releases/download/zavi-v6662-one-debug-qa/ZAVI_one_V6662_DEBUG_QA.apk
          echo '2eb852d7cdb026ccd828a660328bd26bb474f9880430e0ea3007f51489ee50dc  /tmp/old.apk' | sha256sum -c -
          mkdir -p /tmp/v6662
          unzip -q -o /tmp/old.apk 'assets/*' -d /tmp/v6662
      - name: Report exact asset and interface differences
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib,collections
          old=Path('/tmp/v6662/assets')
          new=Path('apps/one')
          oldfiles={p.relative_to(old).as_posix():p for p in old.rglob('*') if p.is_file()}
          newfiles={p.relative_to(new).as_posix():p for p in new.rglob('*') if p.is_file()}
          common=set(oldfiles)&set(newfiles)
          modified=[f for f in sorted(common) if oldfiles[f].read_bytes()!=newfiles[f].read_bytes()]
          old_only=set(oldfiles)-set(newfiles)
          new_only=set(newfiles)-set(oldfiles)
          old_index=oldfiles['index.html'].read_text(encoding='utf-8',errors='replace')
          new_index=newfiles['index.html'].read_text(encoding='utf-8',errors='replace')
          def paths(html,ext):
              pat=r'<(?:link|script)\b[^>]*?(?:href|src)=["\x27]([^"\x27]+)'
              return [x for x in re.findall(pat,html,re.I) if x.split('?')[0].endswith(ext)]
          oc=paths(old_index,'.css');nc=paths(new_index,'.css')
          oj=paths(old_index,'.js');nj=paths(new_index,'.js')
          cssold={p.split('/')[-1].split('?')[0] for p in oc}
          cssnew={p.split('/')[-1].split('?')[0] for p in nc}
          jsold={p.split('/')[-1].split('?')[0] for p in oj}
          jsnew={p.split('/')[-1].split('?')[0] for p in nj}
          # Critical modern-only feature assets; DO NOT remove without porting.
          report={
            'original_index_size':oldfiles['index.html'].stat().st_size,
            'new_index_size':newfiles['index.html'].stat().st_size,
            'old_assets':len(oldfiles),'new_assets':len(newfiles),
            'common_files':len(common),'modified_same_named_files':modified,
            'old_only_assets':sorted(old_only),
            'new_only_assets':sorted(new_only),
            'old_css_links':oc,'current_css_links':nc,
            'old_only_css_links':sorted(cssold-cssnew),
            'new_only_css_links':sorted(cssnew-cssold),
            'old_only_js_links':sorted(jsold-jsnew),
            'new_only_js_links':sorted(jsnew-jsold),
            'old_index_sha256':hashlib.sha256(old_index.encode()).hexdigest(),
            'new_index_sha256':hashlib.sha256(new_index.encode()).hexdigest(),
          }
          Path('legacy-v6662-comparison.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('COMMON FILES:',len(common),'MODIFIED:',len(modified),'ONLY OLD:',len(old_only),'ONLY NEW:',len(new_only))
          print('CSS: ONLY OLD',len(cssold-cssnew),sorted(cssold-cssnew))
          print('JS: ONLY NEW',len(jsnew-jsold),sorted(jsnew-jsold))
          print('JS: ONLY OLD',len(jsold-jsnew),sorted(jsold-jsnew))
          print('MODIFIED MATCHING:',[(p,oldfiles[p].stat().st_size,newfiles[p].stat().st_size) for p in modified[:40]])
          print('INVARIANT: no changes to production source or database')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V6662-EXACT-ASSET-COMPARISON
          path: legacy-v6662-comparison.json
          retention-days: 7

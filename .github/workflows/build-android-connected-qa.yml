name: ZAVI connected sandbox Android APKs — NOT RELEASE
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-android-connected-qa.yml'
      - 'apps/one/zavi-compact-workflow-v1.js'
      - 'apps/one/zavi-purchase-management-v6662.js'
      - 'apps/one/sw.js'
      - 'scripts/test-v6662-purchase-management-browser.py'
      - 'apps/one/zavi-compact-workflow-v1.css'
      - 'apps/one/zavi-purchase-upgrade-v6662.js'
      - 'apps/one/zavi-in-transit-v1.js'
      - 'scripts/test-v6662-purchase-onepage-browser.py'
      - 'scripts/test-in-transit-contract.cjs'
      - 'scripts/test-v6662-sale-onepage-browser.py'
      - 'scripts/test-v6662-products-warehouse-approved-browser.py'
      - 'apps/one/zavi-v6662-pin-visibility-v1.js'
      - 'scripts/test-v6662-login-center-browser.py'
      - 'scripts/test-v6662-owner-dashboard-browser.py'
      - 'apps/one/index.html'
      - 'apps/one/pin-recovery.js'
      - 'apps/one/zavi-approved-entry-v6662.css'
      - 'apps/one/zavi-dual-calendar-v22.js'
      - 'apps/admin/zavi-dual-calendar-v22.js'
      - 'apps/one/zavi-display-digits-v645.js'
      - 'apps/admin/zavi-display-digits-v645.js'
      - 'apps/one/invoice.html'
      - 'apps/one/receipt-ui.js'
      - 'apps/admin/receipt-ui.js'
      - 'scripts/test-v6662-dual-calendar-invoice-numerals-browser.py'
      - 'apps/one/zavi-owner-dashboard-v6662.js'
      - 'apps/one/zavi-owner-dashboard-v6662.css'
      - 'apps/one/zavi-dashboard-polish-v6562.js'
      - 'scripts/stage-original-v6662-model.py'
      - 'apps/one/zavi-final-settings-store-v6559.js'
      - 'apps/one/zavi-approved-settings-v6662.css'
      - 'apps/one/zavi-three-theme-v6627.js'
      - 'apps/one/zavi-final-settings-common-v1.css'
      - 'apps/one/zavi-assistant-visibility-v6619.js'
      - 'apps/one/zavi-store-v6576-settings-profile.js'
      - 'scripts/test-v6662-approved-settings-browser.py'
      - 'apps/one/index.html'
      - 'apps/one/invoice.html'
      - 'apps/one/pin-recovery.js'
      - 'apps/one/zavi-approved-entry-v6662.css'
      - 'apps/one/zavi-dual-calendar-v22.js'
      - 'apps/admin/zavi-dual-calendar-v22.js'
      - 'apps/one/zavi-display-digits-v645.js'
      - 'apps/admin/zavi-display-digits-v645.js'
      - 'scripts/test-v6662-approved-three-section-finish-browser.py'
      - 'scripts/test-v6662-neon-recovery-browser.py'

permissions:
  contents: write
  actions: read
# Only newest dev push should consume Android/visual runner minutes.
# Separate workflow/ref groups retain independent security and release gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-test:
    name: Installable connected test (independent sandbox) — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [one, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Verify public-source safety and packaged resources
        run: |
          python3 scripts/check-public-source-security.py
          python3 scripts/check-migration-integrity.py
          python3 scripts/check-offline-shell-assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce exact owner APK design and verify public Supabase connection
        run: |
          python3 scripts/check-reference-runtime-css.py
          node scripts/test-live-supabase-connection.cjs
          node scripts/test-stage8-admin-source.cjs
      - name: Check app JavaScript syntax
        run: |
          set -euo pipefail
          find apps packages/shared -name '*.js' -type f -print0 |
            while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Verify approved ONE V66.62 sale with disposable Chrome before building APK
        if: matrix.app == 'one'
        run: |
          python3 scripts/test-v6662-sale-onepage-browser.py
          python3 scripts/test-v6662-purchase-onepage-browser.py
          python3 scripts/test-v6662-products-warehouse-approved-browser.py
          python3 scripts/test-v6662-purchase-management-browser.py
          python3 scripts/test-v6662-login-center-browser.py
          python3 scripts/test-phase2-recovery-contract-browser.py
          python3 scripts/test-v6662-neon-recovery-browser.py
          python3 scripts/test-v6662-approved-three-section-finish-browser.py
          python3 scripts/test-v6662-owner-dashboard-browser.py
          python3 scripts/test-v6662-dual-calendar-invoice-numerals-browser.py
          python3 scripts/test-v6662-approved-settings-browser.py
          python3 scripts/test-stage6-financial-theme-browser.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
      - name: Download and verify Gradle 8.13 (mirror fallback)
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          # Official Gradle 8.13 wrapper blob; no untrusted substitute is accepted.
          test "$(git hash-object gradle/wrapper/gradle-wrapper.jar)" = "9bbc975c742b298b441bfb90dbc124400a3751b9"
          zip="$RUNNER_TEMP/gradle-8.13-bin.zip"
          expected="20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
          downloaded=false
          # Gradle's public distribution endpoints sometimes redirect to a GitHub
          # release that returns HTTP 504. The alternate mirror is checksum-verified.
          for url in \
            "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.13-bin.zip"; do
            echo "Fetching Gradle 8.13 from: $url"
            if curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 20 --max-time 240 \
              --output "$zip" "$url"; then
              if printf '%s  %s\n' "$expected" "$zip" | sha256sum --check --status; then
                downloaded=true
                break
              fi
              echo "::warning::Gradle checksum mismatch; rejecting this download"
            fi
          done
          test "$downloaded" = true
          # CI-only local ZIP override: source file retains the official remote
          # download URL and pinned distributionSha256Sum for non-CI builds.
          sed -i "s#^distributionUrl=.*#distributionUrl=file://$zip#" gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version --no-daemon
      - name: Create a one-run sandbox preview key (never used for Release)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$CI" = true
          echo "::warning::CONNECTED TEST — distinct installable sandbox with LIVE public-key cloud. Never use a live business account. NEVER RELEASE."
          target="$RUNNER_TEMP/zavi-${{ matrix.app }}-isolated-testonly.p12"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$target" \
            -alias zavi-isolated-test-only -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=CONNECTED-TEST-NOT-RELEASE, O=ZAVI QA" \
            -storepass "$password" -keypass "$password" >/dev/null 2>&1
          {
            echo "ZAVI_ISOLATED_TEST_STORE_FILE=$target"
            echo "ZAVI_ISOLATED_TEST_STORE_PASSWORD=$password"
            echo "ZAVI_ISOLATED_TEST_KEY_ALIAS=zavi-isolated-test-only"
            echo "ZAVI_ISOLATED_TEST_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Stage app and shared assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          cp -a "apps/${{ matrix.app }}/." android-build/app/src/main/assets/
          mkdir -p android-build/app/src/main/assets/packages/shared
          cp -a packages/shared/. android-build/app/src/main/assets/packages/shared/ || true
          for shared_file in database/supabase-config.js security/access-contract.js i18n/language-core.js; do
            mkdir -p "android-build/app/src/main/assets/packages/shared/$(dirname "$shared_file")"
            cp "packages/shared/$shared_file" "android-build/app/src/main/assets/packages/shared/$shared_file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android-build/app/src/main/assets')
          html=root/'index.html'
          content=html.read_text(encoding='utf-8')
          content=content.replace('../../packages/shared/','./packages/shared/')
          content=content.replace('../packages/shared/','./packages/shared/')
          html.write_text(content,encoding='utf-8')
          # Keep EXACT owner-approved CSS plus real cloud source. No demo replacement.
          project='wbbmwfnmurpphwxesssx'
          shared=(root/'packages/shared/database/supabase-config.js').read_text(encoding='utf-8')
          assert project in shared, 'Shared Supabase project mismatch'
          if '${{ matrix.app }}'=='one':
              client=(root/'cloud-config.js').read_text(encoding='utf-8')
          else:
              client=(root/'app.js').read_text(encoding='utf-8')
          assert 'https://'+project+'.supabase.co' in client, 'App cloud project mismatch'
          assert re.search(r'sb_publishable_[A-Za-z0-9_-]{20,}',client), 'Missing public cloud client key'
          assert not re.search(r'''(?m)\bkey\s*:\s*['"]sb_secret_''',client), 'No private Supabase key permitted'
          # Only the disposable installable preview identity is changed in CI.
          # Original Gradle config, app source and production signatures are untouched.
          gradle=Path('android-build/app/build.gradle')
          gradle_text=gradle.read_text(encoding='utf-8')
          substitutions={
            "applicationIdSuffix '.offlinepreview'":("applicationIdSuffix '.approvedsettingspreview.r${{ github.run_number }}'" if '${{ matrix.app }}'=='one' else "applicationIdSuffix '.connectedpreview.r${{ github.run_number }}'"),
            "versionNameSuffix '-OFFLINE-PREVIEW-NOT-RELEASE'":"versionNameSuffix '-CONNECTED-TEST-NOT-RELEASE'",
            "ZAVI ADMIN OFFLINE PREVIEW":"ZAVI ADMIN QA ${{ github.run_number }}",
            "ZAVI ONE OFFLINE PREVIEW":"ZAVI ONE QA ${{ github.run_number }}",
          }
          for original,new in substitutions.items():
              assert gradle_text.count(original)==1, 'Unexpected preview Gradle structure: '+original
              gradle_text=gradle_text.replace(original,new)
          if '${{ matrix.app }}'=='one':
              old="versionName ((admin ? '1.4.69-reborn.qa' : '66.78-reborn.qa') + '.' + ciBuildNumber)"
              new="versionName ((admin ? '1.4.69-reborn.qa' : '66.62-settings.qa') + '.' + ciBuildNumber)"
              assert old in gradle_text,'Preview versionName structure unexpectedly changed'
              gradle_text=gradle_text.replace(old,new)
          gradle.write_text(gradle_text,encoding='utf-8')
          print('PASS: original CSS preserved; connected staging uses only the public Supabase key')
          print('NOTICE: this separately installed QA APK can contact the real server. Use TEST accounts only.')
          PY
          if [[ "${{ matrix.app }}" == "one" ]]; then
            version="66.62-settings.qa.$GITHUB_RUN_NUMBER-CONNECTED-TEST-NOT-RELEASE"
            package="com.zavione.one.approvedsettingspreview.r$GITHUB_RUN_NUMBER"
          else
            version="1.4.69-reborn.qa.$GITHUB_RUN_NUMBER-CONNECTED-TEST-NOT-RELEASE"
            package="com.zavione.one.admin.connectedpreview.r$GITHUB_RUN_NUMBER"
          fi
          printf '{"commit":"%s","app":"%s","run":"%s","version":"%s","package":"%s","kind":"CONNECTED-TEST-NOT-RELEASE","server":"live-public-key","signing":"%s"}\n' \
            "$GITHUB_SHA" "${{ matrix.app }}" "$GITHUB_RUN_NUMBER" "$version" "$package" "ephemeral-connected-test" \
            > android-build/app/src/main/assets/zavi-build-info.json
          test -s android-build/app/src/main/assets/zavi-build-info.json
          mkdir -p android-build/app/src/main/res/drawable-nodpi android-build/app/src/main/res/values android-build/app/src/main/res/xml
          cp "apps/${{ matrix.app }}/icon-192.png" android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.png
          printf '%s\n' '<resources><style name="ZaviTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:windowLightStatusBar">false</item></style></resources>' > android-build/app/src/main/res/values/styles.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="camera" path="."/></paths>' > android-build/app/src/main/res/xml/zavi_camera_paths.xml
      - name: Include authentic 62 MB original V66.62 offline voice model in ONE only
        if: matrix.app == 'one'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-v6662"
          gh release download zavi-v6662-one-debug-qa \
            -R zavyanmasoom3-source/Zavione \
            -p ZAVI_one_V6662_DEBUG_QA.apk -D "$RUNNER_TEMP/original-v6662"
          python3 scripts/stage-original-v6662-model.py \
            "$RUNNER_TEMP/original-v6662/ZAVI_one_V6662_DEBUG_QA.apk" \
            android-build/app/src/main/assets
          rm -f "$RUNNER_TEMP/original-v6662/ZAVI_one_V6662_DEBUG_QA.apk"
      - name: Validate WebView source
        run: |
          if [[ "${{ matrix.app }}" == "one" ]]; then
            python3 scripts/prepare-v6662-native-webview.py android-build/app/src/main/assets/index.html
          fi
          python3 scripts/fix-webview-receipt.py
          python3 scripts/validate-webview-html.py
      - name: Clean and assemble distinct connected sandbox test APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:clean :app:assembleInstallablePreview \
            -PzaviApp=${{ matrix.app }} -PzaviBuildNumber=${{ github.run_number }} \
            -PzaviInstallablePreview=true --no-build-cache --stacktrace
      - name: Verify non-testOnly preview package, APK signature and file hash
        shell: bash
        run: |
          set -euo pipefail
          echo 'Isolated APK output paths:'
          find android-build/app/build/outputs/apk -maxdepth 3 -type f -name '*.apk' -print
          apk=$(find android-build/app/build/outputs/apk/installablePreview -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [[ -z "$apk" ]]; then echo "::error::Expected isolated APK not found"; exit 1; fi
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          # AGP emitted v2+v3 but no v1 despite the signingConfig flag.
          # Re-sign with the *same isolated CI-only key* and force all three
          # Android APK signature schemes; never relax any verifier.
          resigned="$RUNNER_TEMP/zavi-connected-test-v123.apk"
          "$apksigner" sign --ks "$ZAVI_ISOLATED_TEST_STORE_FILE"             --ks-type PKCS12 --ks-key-alias "$ZAVI_ISOLATED_TEST_KEY_ALIAS"             --ks-pass env:ZAVI_ISOLATED_TEST_STORE_PASSWORD             --key-pass env:ZAVI_ISOLATED_TEST_KEY_PASSWORD             --v1-signing-enabled true --v2-signing-enabled true             --v3-signing-enabled true --v4-signing-enabled false             --out "$resigned" "$apk"
          apk="$resigned"
          if ! "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/isolated-apk-verify.txt" 2>&1; then
            cat "$RUNNER_TEMP/isolated-apk-verify.txt"
            echo "::error::APK cryptographic signature verification failed"; exit 1
          fi
          output=$(cat "$RUNNER_TEMP/isolated-apk-verify.txt")
          printf '%s\n' "$output"
          # API 26+ default check may skip obsolete v1 even if it is present.
          # Verify v2/v3 against the actual minSdk, then test v1 against API 23.
          for scheme in v2 v3; do
            if ! grep -E "Verified using $scheme scheme.*: true" <<< "$output" >/dev/null; then
              echo "::error::Missing verified signing scheme $scheme"; exit 1
            fi
          done
          legacy=$("$apksigner" verify --min-sdk-version 23 --verbose --print-certs "$apk")
          if ! grep -E 'Verified using v1 scheme.*: true' <<< "$legacy" >/dev/null; then
            echo "::error::JAR v1 signature missing or invalid under Android 23 verification"; exit 1
          fi
          default_cert=$(grep -F 'Signer #1 certificate SHA-256 digest:' <<< "$output")
          legacy_cert=$(grep -F 'Signer #1 certificate SHA-256 digest:' <<< "$legacy")
          test -n "$default_cert" && test "$default_cert" = "$legacy_cert"
          printf 'PASS: v1 (API 23), v2 + v3 (declared minSDK) and same certificate\n'
          printf '%s\n' "$default_cert"
          badging=$("$aapt" dump badging "$apk")
          package=$(sed -n '1p' <<< "$badging")
          echo "$package"
          if [[ "${{ matrix.app }}" == one ]]; then
            grep -F "name='com.zavione.one.approvedsettingspreview.r$GITHUB_RUN_NUMBER'" <<< "$package"
          else
            grep -F "name='com.zavione.one.admin.connectedpreview.r$GITHUB_RUN_NUMBER'" <<< "$package"
          fi
          grep -F 'CONNECTED-TEST-NOT-RELEASE' <<< "$package"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -E 'testOnly.*0x0$' >/dev/null
          if "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -E 'testOnly.*0xffffffff' >/dev/null; then
            echo "::error::Preview unexpectedly became testOnly=true"; exit 1
          fi
          unzip -p "$apk" assets/zavi-build-info.json | grep -F '"kind":"CONNECTED-TEST-NOT-RELEASE"'
          test -s "$apk"
          if [[ "${{ matrix.app }}" == one ]]; then
            python3 - "$apk" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          with ZipFile(p) as z:
            info=z.getinfo('assets/models/ggml-base-q5_1.bin')
            assert info.file_size==59707625,('Original 66.62 offline model is missing',info.file_size)
            assert 'assets/zavi-compact-workflow-v1.js' in z.namelist()
            assert 'assets/zavi-compact-workflow-v1.css' in z.namelist()
            # Prove the APK contains the CURRENT approved implementation, not
            # merely an old file with the same name (the owner's reported bug).
            approved_files=(
              'zavi-compact-workflow-v1.js','zavi-compact-workflow-v1.css',
              'zavi-warehouses-v1.js','zavi-barcode-label-v6700.js',
              'zavi-product-adaptive-v6662.js','zavi-in-transit-v1.js'
            )
            for name in approved_files:
              apk_content=z.read('assets/'+name)
              source_content=Path('apps/one',name).read_bytes()
              assert apk_content==source_content,('APK differs from committed approved source',name)
            compact=z.read('assets/zavi-compact-workflow-v1.js').decode('utf-8')
            assert "scanner.insertAdjacentHTML('afterend',window.ZaviWarehouseV1.panel())" in compact, \
              'APK missing real native warehouse mount fix'
            assert "zavi-products-overview" in compact and "zavi-products-label-panel" in compact, \
              'APK missing approved simple product and label layout'
            native_html=z.read('assets/index.html').decode('utf-8')
            for name in approved_files:
              if name.endswith('.js'):
                assert name in native_html,('Native APK index does not load',name)
            assert 'assets/zavi-build-info.json' in z.namelist()
            assert 'assets/zavi-approved-settings-v6662.css' in z.namelist(), 'Approved seven-section settings CSS was not packaged'
            assert 'assets/zavi-final-settings-store-v6559.js' in z.namelist(), 'Settings grouping JS not packaged'
            assert 'assets/zavi-three-theme-v6627.js' in z.namelist(), 'Three-mode control JS not packaged'
            native=z.read('assets/zavi-three-theme-v6627.js').decode('utf-8')
            assert 'zavi-clean-settings-group[data-group="look"]' in native, 'Fix for extra theme panel is missing'
            approved=z.read('assets/zavi-final-settings-store-v6559.js').decode('utf-8')
            assert 'ZaviUnifiedSettingsApproved' in approved and 'ابر و دستگاه‌ها' in approved, 'Old settings grouping was packaged'
          assert 60000000 <= p.stat().st_size <= 85000000,('Not a full-original-model APK',p.stat().st_size)
          print('PASS: complete full-sized original 66.62 model and approved sale UI in signed APK:',p.stat().st_size,'bytes')
          PY
          fi
          mkdir -p connected-test-output
          cp "$apk" "connected-test-output/ZAVI_${{ matrix.app }}_CONNECTED-TEST-NOT-RELEASE.apk"
          (cd connected-test-output && sha256sum *.apk > SHA256SUMS.txt)
          cat connected-test-output/SHA256SUMS.txt
          echo "::warning::CONNECTED SANDBOX TEST only; use throwaway account, never actual accounting data; original APK remains untouched."
      - uses: actions/upload-artifact@v4
        with:
          name: CONNECTED-TEST-NOT-RELEASE-Android-${{ matrix.app }}
          path: connected-test-output/
          retention-days: 4
          if-no-files-found: error
      - name: Destroy one-run preview signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/zavi-${{ matrix.app }}-isolated-testonly.p12"

  publish-connected-test:
    name: Publish two VERIFIED test-only APKs as direct GitHub assets
    needs: isolated-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CONNECTED-TEST-NOT-RELEASE-Android-one
          path: input/one
      - uses: actions/download-artifact@v4
        with:
          name: CONNECTED-TEST-NOT-RELEASE-Android-admin
          path: input/admin
      - name: Verify exact build commit, independent package and artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p direct-apks
          for app in one admin; do
            (cd "input/$app" && sha256sum -c SHA256SUMS.txt)
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,os,zipfile
          sha=os.environ['GITHUB_SHA']
          run=os.environ['GITHUB_RUN_NUMBER']
          for app in ('one','admin'):
              p=Path(f'input/{app}/ZAVI_{app}_CONNECTED-TEST-NOT-RELEASE.apk')
              assert p.is_file() and p.stat().st_size>1_000_000,p
              with zipfile.ZipFile(p) as z:
                  info=json.loads(z.read('assets/zavi-build-info.json'))
              assert info['commit']==sha,(app,'wrong commit')
              assert info['run']==run,(app,'wrong run')
              assert info['kind']=='CONNECTED-TEST-NOT-RELEASE',(app,'wrong build kind')
              assert info['package']==('com.zavione.one.admin.connectedpreview.r'+run if app=='admin'
                else 'com.zavione.one.approvedsettingspreview.r'+run),info
              assert info['server']=='live-public-key',(app,'not connected')
              assert info['signing']=='ephemeral-connected-test',(app,'unexpected signing')
              target=Path('direct-apks')/('ZAVI_ONE_ADMIN_CONNECTED_TEST.apk' if app=='admin' else 'ZAVI_ONE_V6662_FULL_OFFLINE_CONNECTED_TEST.apk')
              target.write_bytes(p.read_bytes())
              print('PASS: verified connected test APK',app,'bytes:',p.stat().st_size)
          PY

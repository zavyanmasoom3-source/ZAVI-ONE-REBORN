name: V66.62 adaptive product focus QA
on:
  push:
    branches: [dev]
    paths:
      - 'apps/one/zavi-product-adaptive-v6662.js'
      - 'apps/one/zavi-variant-inventory-v6662.js'
      - 'apps/one/index.html'
      - 'apps/one/zavi-product-adaptive-v6662.css'
      - 'apps/one/zavi-industry-forms-v6529.js'
      - 'apps/one/zavi-camera-scan-v635.js'
      - 'apps/one/v47-business.js'
      - 'apps/one/zavi-unified20.js'
      - 'apps/one/v25-business.html'
      - 'scripts/test-v6662-21-trade-product-schema.cjs'
      - 'scripts/test-v6662-variant-stock-ledger.cjs'
      - 'scripts/test-v6662-colour-warehouse-journal.cjs'
      - 'scripts/test-v6662-owner-business-type-lock.cjs'
      - 'scripts/test-v6662-adaptive-products-browser.py'
      - 'scripts/test-v6662-variant-native-transactions-browser.py'
      - 'scripts/test-v6662-business-type-locked-browser.py'
      - '.github/workflows/adaptive-product-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 21-trade schema, gold jewellery, colours and barcodes
        run: node scripts/test-v6662-21-trade-product-schema.cjs
      - name: Test colour ledger arithmetic and migration safety (offline)
        run: node scripts/test-v6662-variant-stock-ledger.cjs
      - name: Test colour-by-warehouse transfers, offline replay, and negative-stock prevention
        run: node scripts/test-v6662-colour-warehouse-journal.cjs
      - name: Test explicit owner confirmation and stable business type offline
        run: python3 scripts/test-v6662-business-type-locked-browser.py
      - name: Verify actual owner trade-save guard and no automatic type switching
        run: node scripts/test-v6662-owner-business-type-lock.cjs
      - name: Test original native product modal in throwaway Chrome
        run: python3 scripts/test-v6662-adaptive-products-browser.py
      - name: Test real native colour sale purchase void and offline persistence
        run: python3 scripts/test-v6662-variant-native-transactions-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zavi-v6662-adaptive-product-evidence
          path: qa-v6662-adaptive-products/
          if-no-files-found: ignore
          retention-days: 7

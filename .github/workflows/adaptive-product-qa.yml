name: V66.62 adaptive product focus QA
on:
  push:
    branches: [dev]
    paths:
      - 'apps/one/zavi-product-adaptive-v6662.js'
      - 'apps/one/zavi-product-adaptive-v6662.css'
      - 'apps/one/zavi-industry-forms-v6529.js'
      - 'apps/one/zavi-camera-scan-v635.js'
      - 'apps/one/v47-business.js'
      - 'apps/one/zavi-unified20.js'
      - 'apps/one/v25-business.html'
      - 'scripts/test-v6662-21-trade-product-schema.cjs'
      - 'scripts/test-v6662-adaptive-products-browser.py'
      - '.github/workflows/adaptive-product-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 21-trade schema, gold jewellery, colours and barcodes
        run: node scripts/test-v6662-21-trade-product-schema.cjs
      - name: Test original native product modal in throwaway Chrome
        run: python3 scripts/test-v6662-adaptive-products-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zavi-v6662-adaptive-product-evidence
          path: qa-v6662-adaptive-products/
          if-no-files-found: ignore
          retention-days: 7

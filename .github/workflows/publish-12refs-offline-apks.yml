name: Direct ZAVI 12-photo offline preview APK downloads
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/publish-12refs-offline-apks.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and validate existing Android preview APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads/one downloads/admin public
          for spec in 'one:13674111311' 'admin:13672414968'; do
            app="$(cut -d: -f1 <<< "$spec")"
            id="$(cut -d: -f2 <<< "$spec")"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "downloads/$app.zip"
            unzip -q "downloads/$app.zip" -d "downloads/$app"
            (cd "downloads/$app" && sha256sum --check SHA256SUMS.txt)
          done
          cp downloads/one/ZAVI_one_OFFLINE-PREVIEW-NOT-RELEASE.apk public/ZAVI_ONE_NEW_UI_QA_20261109.apk
          cp downloads/admin/ZAVI_admin_OFFLINE-PREVIEW-NOT-RELEASE.apk public/ZAVI_ONE_ADMIN_NEW_UI_QA_20261109.apk
          printf '%s  %s\n' \
            'd0d674da6b7066ccc05712e2124ab29ac8e6804f7097f925808101d5f1199165' 'public/ZAVI_ONE_NEW_UI_QA_20261109.apk' \
            '8dbd14e14afaf5f986d8cedead9f11a689f5e2546ef5d89787422ac600927def' 'public/ZAVI_ONE_ADMIN_NEW_UI_QA_20261109.apk' | sha256sum -c
          python3 - <<'PY'
          import json,zipfile
          expected='f096b04f6267d8a28a70afbed3381f6c77e6dc36'
          for app,file in [('one','public/ZAVI_ONE_NEW_UI_QA_20261109.apk'),
                           ('admin','public/ZAVI_ONE_ADMIN_NEW_UI_QA_20261109.apk')]:
              with zipfile.ZipFile(file) as z:
                  assert z.testzip() is None
                  info=json.loads(z.read('assets/zavi-build-info.json'))
                  assert info['commit']==expected and info['app']==app
                  assert info['kind']=='OFFLINE-PREVIEW-NOT-RELEASE'
                  assert info['package'].endswith('.offlinepreview')
                  print('VALIDATED',app,info['commit'])
          PY
      - name: Publish non-production prerelease with direct .apk assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='zavi-12photos-offline-preview-20261109-f096b04f'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" public/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" public/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target f096b04f6267d8a28a70afbed3381f6c77e6dc36 \
              --title 'ZAVI ONE + ADMIN | 12-photo UPDATED UI | OFFLINE QA — NOT RELEASE' \
              --notes 'UI QA ONLY, not pixel-parity certified. Android-only offline preview, no production Supabase, not an upgrade. Do not enter real financial data. Verified against exact build commit f096b04f6267d8a28a70afbed3381f6c77e6dc36.' \
              --prerelease
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url > release.json
          python3 - <<'PY'
          import json
          v=json.load(open('release.json'))
          assert v['isPrerelease']
          expected={'ZAVI_ONE_NEW_UI_QA_20261109.apk','ZAVI_ONE_ADMIN_NEW_UI_QA_20261109.apk'}
          assets={a['name']:a for a in v['assets']}
          assert expected.issubset(assets)
          for name in sorted(expected):
              assert assets[name]['size']>3000000
              print('DIRECT_LINK',assets[name]['url'])
          print('RELEASE',v['url'])
          PY

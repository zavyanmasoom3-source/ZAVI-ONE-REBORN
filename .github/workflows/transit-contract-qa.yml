name: ZAVI transit contract checks
on:
  push:
    branches: [dev]
    paths:
      - 'apps/one/zavi-in-transit-v1.js'
      - 'apps/one/zavi-in-transit-v1.css'
      - 'apps/one/index.html'
      - 'apps/one/sw.js'
      - 'scripts/test-in-transit-contract.cjs'
      - 'scripts/test-in-transit-browser.py'
      - 'scripts/test-in-transit-guard.sql'
      - 'supabase/staged/20261109_in_transit_receipt_guard_CANDIDATE.sql'
      - '.github/workflows/transit-contract-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check apps/one/zavi-in-transit-v1.js
      - name: Verify synthetic order and receipt contract
        run: node scripts/test-in-transit-contract.cjs
      - name: Check PWA asset references
        run: python3 scripts/check-offline-shell-assets.py
      - name: Verify real Chrome purchase-order interactions with synthetic server
        run: python3 scripts/test-in-transit-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAVI-IN-TRANSIT-CHROME-QA
          path: qa-in-transit/
          if-no-files-found: ignore
          retention-days: 7

  transit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Test candidate guard on disposable PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only-postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-in-transit-guard.sql

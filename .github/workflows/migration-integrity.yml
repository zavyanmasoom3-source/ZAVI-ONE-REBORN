name: Migration integrity gate
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration completeness
        run: python3 scripts/check-migration-integrity.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

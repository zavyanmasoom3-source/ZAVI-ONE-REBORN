name: Migration integrity gate
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject privileged secrets in public source
        run: python3 scripts/check-public-source-security.py
      - name: Verify anonymous access is denied by real ADMIN RPCs
        run: python3 scripts/test-admin-rpc-authorization.py
      - name: Verify APK build version metadata is fresh and QA-only
        run: python3 scripts/test-stamp-qa-version.py
      - name: Verify migration completeness
        run: python3 scripts/check-migration-integrity.py
      - name: Verify APK identity and signing safety checks
        run: python3 scripts/test-apk-update-gate.py
      - name: Verify crash-safe cloud synchronization and full workspace acknowledgements
        run: node scripts/test-cloud-sync-safety.cjs
      - name: Check complete offline bundles for both apps
        run: python3 scripts/check-offline-shell-assets.py
      - name: Regression for recovered offline sale against newer mock server
        run: python3 scripts/test-cloud-sync-browser.py
      - name: Verify service-worker installed asset cache in real browser
        run: python3 scripts/test-offline-shell-browser.py
      - name: Verify route navigation and settings design
        run: python3 scripts/verify-ui-navigation.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Test restored barcode encoders
        run: node scripts/test-barcode-label.cjs
      - name: Test WhatsApp message templates and scoped queues
        run: node scripts/test-message-center.cjs
      - name: Smoke test 10 real routes in headless Chrome
        run: python3 scripts/test-navigation-browser.py
      - name: Smoke test non-empty accounting snapshot and financial invariants
        run: python3 scripts/test-persisted-data-browser.py
      - name: Validate opt-in safe old-APK migration UI
        run: python3 scripts/test-safe-transfer-browser.py
      - name: Check backup integrity, tamper rejection, scoped restore in browser
        run: python3 scripts/test-backup-integrity-browser.py
      - name: Test actual file import and storage recovery without touching real users
        run: python3 scripts/test-backup-import-browser.py
      - name: Check accounting returns, transfers, FX, voided documents and opening debts
        run: python3 scripts/test-accounting-edge-cases-browser.py

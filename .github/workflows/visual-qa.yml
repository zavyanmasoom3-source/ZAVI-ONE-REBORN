name: REBORN PDF visual QA screenshots
on:
  push:
    branches: [dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/render-qa-screens.py'
      - 'scripts/test-pdf-59-route-coverage.py'
      - 'scripts/test-login-design-browser.py'
      - 'scripts/test-shared-design-browser.py'
      - 'scripts/test-compact-workflow-browser.py'
      - 'scripts/test-admin-settings-layout-browser.py'
      - 'packages/shared/ui/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose actual applied appearance and CSS
        run: python3 scripts/diagnose-theme-qa.py
      - name: Render real app screens with Chrome
        run: python3 scripts/render-qa-screens.py
      - name: Capture actual browser route evidence for all 59 PDF mappings
        run: python3 scripts/test-pdf-59-route-coverage.py
      - name: Check ONE and ADMIN login controls across three themes and language labels
        run: python3 scripts/test-login-design-browser.py
      - name: Measure actual shared color contrast, language, date and field errors in Chrome
        run: python3 scripts/test-shared-design-browser.py
      - name: Test live money, reports and purchase stages in Chrome
        run: python3 scripts/test-compact-workflow-browser.py
      - name: Verify ADMIN settings controls survive compact grouping in disposable browser
        run: python3 scripts/test-admin-settings-layout-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: REBORN-PDF-VISUAL-QA
          path: |
            qa-screens/
            qa-pdf-routes/
            qa-login-design/
            qa-design-contrast/
            qa-compact-workflow/
            qa-admin-compact/
          retention-days: 7
          if-no-files-found: error

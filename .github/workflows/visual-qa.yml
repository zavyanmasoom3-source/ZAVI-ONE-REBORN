name: Owner original APK style visual QA
on:
  push:
    branches: [dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/diagnose-theme-qa.py'
      - 'scripts/render-qa-screens.py'
      - 'scripts/test-pdf-59-route-coverage.py'
      - 'scripts/test-login-design-browser.py'
      - 'scripts/test-v6662-login-center-browser.py'
      - 'scripts/test-v6662-owner-dashboard-browser.py'
      - 'apps/one/zavi-owner-dashboard-v6662.js'
      - 'apps/one/zavi-owner-dashboard-v6662.css'
      - 'scripts/test-v6662-sale-onepage-browser.py'
      - 'scripts/test-v6662-purchase-onepage-browser.py'
      - 'scripts/test-v6662-owner-sales-management-browser.py'
      - 'scripts/test-v6662-adaptive-products-browser.py'
      - 'scripts/test-v6662-21-trade-product-schema.cjs'
      - 'scripts/test-phase2-recovery-contract-browser.py'
      - 'scripts/test-v6662-neon-recovery-browser.py'
      - 'scripts/test-phase2-display-sizes-browser.py'
      - 'scripts/test-phase3-offline-status-browser.py'
      - 'scripts/test-shared-design-browser.py'
      - 'scripts/test-unified-reference-browser.py'
      - 'scripts/test-stage6-financial-theme-browser.py'
      - 'scripts/test-admin-settings-layout-browser.py'
      - 'scripts/test-owner-apk-style-browser.py'
      - 'scripts/check-reference-runtime-css.py'
      - 'scripts/check-inline-javascript-syntax.py'
      - 'scripts/test-reference-auxiliary-pages.py'
      - 'scripts/audit-retired-ui-assets.py'
      - 'packages/shared/ui/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify auxiliary invoice, shop, install and offline pages use valid reference CSS
        run: python3 scripts/test-reference-auxiliary-pages.py
      - name: Audit legacy assets for indirect runtime dependencies
        run: python3 scripts/audit-retired-ui-assets.py
      - name: Reject retired page-wide CSS and check reference-only entrypoints
        run: python3 scripts/check-reference-runtime-css.py
      - name: Parse embedded ONE and ADMIN JavaScript before expensive browser tests
        run: python3 scripts/check-inline-javascript-syntax.py
      - name: Diagnose actual applied appearance and CSS
        run: python3 scripts/diagnose-theme-qa.py
      - name: Verify offline Vazirmatn before visual screenshots
        run: node scripts/test-local-vazirmatn.cjs
      - name: Render real app screens with Chrome
        run: python3 scripts/render-qa-screens.py
      - name: Capture actual browser route evidence for all 59 PDF mappings
        run: python3 scripts/test-pdf-59-route-coverage.py
      - name: Check ONE and ADMIN login controls across three themes and language labels
        run: python3 scripts/test-login-design-browser.py
      - name: Verify V66.62 PIN login is fully centered with no clipped side edges across mobile sizes
        run: python3 scripts/test-v6662-login-center-browser.py
      - name: Verify approved dashboard with actual account values, all visible sections and mobile animations
        run: python3 scripts/test-v6662-owner-dashboard-browser.py
      - name: Verify 21 product schemas, gold jewellery and validated colour metadata
        run: node scripts/test-v6662-21-trade-product-schema.cjs
      - name: Verify actual adaptive product modal for cases and gold, with no financial writes
        run: python3 scripts/test-v6662-adaptive-products-browser.py
      - name: Verify approved sales manager with native archives, search, returns and multi-theme layout
        run: python3 scripts/test-v6662-owner-sales-management-browser.py
      - name: Verify approved compact purchase invoice, real FX/discount, barcode and payment controls
        run: python3 scripts/test-v6662-purchase-onepage-browser.py
      - name: Verify approved one-page sale, typed unit price, barcode repeat and safe submission
        run: python3 scripts/test-v6662-sale-onepage-browser.py
      - name: Verify full private PIN recovery with isolated fake owner approval
        run: python3 scripts/test-phase2-recovery-contract-browser.py
      - name: Verify owner-approved neon recovery on phones, themes, languages and native cancel
        run: python3 scripts/test-v6662-neon-recovery-browser.py
      - name: Verify independent text/interface/icon sliders and persistence
        run: python3 scripts/test-phase2-display-sizes-browser.py
      - name: Validate owner-scoped offline status and instant locale switching
        run: python3 scripts/test-phase3-offline-status-browser.py
      - name: Test common three-mode reference tokens and safe DOM components
        run: python3 scripts/test-unified-reference-browser.py
      - name: Measure actual shared color contrast, language, date and field errors in Chrome
        run: python3 scripts/test-shared-design-browser.py
      - name: Test original V66.62 workflows with real synthetic finance across three themes and languages
        run: python3 scripts/test-stage6-financial-theme-browser.py
      - name: Verify ADMIN settings controls survive compact grouping in disposable browser
        run: python3 scripts/test-admin-settings-layout-browser.py
      - name: Verify exact owner-uploaded original ONE and ADMIN styles in actual browser
        run: python3 scripts/test-owner-apk-style-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI-ORIGINAL-OWNER-APK-VISUAL-QA
          path: |
            qa-screens/
            qa-pdf-routes/
            qa-login-design/
            qa-v6662-login-center/
            qa-v6662-dashboard/
            qa-phase2-recovery/
            qa-v6662-neon-auth/
            qa-design-contrast/
            qa-unified-reference/
            qa-v6662-sale/
            qa-v6662-purchase/
            qa-v6662-sales-management/
            qa-v6662-adaptive-products/
            qa-admin-compact/
            qa-owner-apk-style/
          retention-days: 7
          if-no-files-found: error

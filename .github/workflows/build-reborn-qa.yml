name: REBORN clean Android QA builds

on:
  push:
    branches: [dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'android-build/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-reborn-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa:
    name: QA Android ${{ matrix.app }}
    # Secrets are never supplied to untrusted forks. PRs are validated by the
    # independent migration-integrity workflow without building signed APKs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [one, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Reject privileged secrets in public source
        run: python3 scripts/check-public-source-security.py
      - name: Block incomplete migrations
        run: python3 scripts/check-migration-integrity.py
      - name: Check complete offline bundles for both apps
        run: python3 scripts/check-offline-shell-assets.py
      - name: Verify route navigation and settings design
        run: python3 scripts/verify-ui-navigation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript parses in both apps and shared modules
        shell: bash
        run: |
          set -euo pipefail
          find apps packages/shared -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
      - name: Download and verify Gradle 8.13 (mirror fallback)
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          # Official Gradle 8.13 wrapper blob; no untrusted substitute is accepted.
          test "$(git hash-object gradle/wrapper/gradle-wrapper.jar)" = "9bbc975c742b298b441bfb90dbc124400a3751b9"
          zip="$RUNNER_TEMP/gradle-8.13-bin.zip"
          expected="20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
          downloaded=false
          # Gradle's public distribution endpoints sometimes redirect to a GitHub
          # release that returns HTTP 504. The alternate mirror is checksum-verified.
          for url in \
            "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.13-bin.zip"; do
            echo "Fetching Gradle 8.13 from: $url"
            if curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 20 --max-time 240 \
              --output "$zip" "$url"; then
              if printf '%s  %s\n' "$expected" "$zip" | sha256sum --check --status; then
                downloaded=true
                break
              fi
              echo "::warning::Gradle checksum mismatch; rejecting this download"
            fi
          done
          test "$downloaded" = true
          # CI-only local ZIP override: source file retains the official remote
          # download URL and pinned distributionSha256Sum for non-CI builds.
          sed -i "s#^distributionUrl=.*#distributionUrl=file://$zip#" gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version --no-daemon
      - name: Require persistent per-app QA certificate (no debug fallback)
        shell: bash
        env:
          ZAVI_KEYSTORE_BASE64: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_KEYSTORE_BASE64 || secrets.ZAVI_ADMIN_KEYSTORE_BASE64 }}
          ZAVI_STORE_PASSWORD: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_STORE_PASSWORD || secrets.ZAVI_ADMIN_STORE_PASSWORD }}
          ZAVI_KEY_ALIAS: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_KEY_ALIAS || secrets.ZAVI_ADMIN_KEY_ALIAS }}
          ZAVI_KEY_PASSWORD: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_KEY_PASSWORD || secrets.ZAVI_ADMIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for field in ZAVI_KEYSTORE_BASE64 ZAVI_STORE_PASSWORD ZAVI_KEY_ALIAS ZAVI_KEY_PASSWORD; do
            if [[ -z "${!field}" ]]; then
              echo "::error::Missing $field for ${{ matrix.app }}. Persistent signing secrets required; debug signing is forbidden."
              exit 1
            fi
          done
          target="$RUNNER_TEMP/zavi-${{ matrix.app }}-stable-release.p12"
          printf '%s' "$ZAVI_KEYSTORE_BASE64" | base64 --decode > "$target"
          chmod 600 "$target"
          keytool -list -storetype PKCS12 -keystore "$target" -storepass "$ZAVI_STORE_PASSWORD" -alias "$ZAVI_KEY_ALIAS" >/dev/null
          expected=$(python3 -c 'import json,sys; print(json.load(open("signing/certificates.json"))[sys.argv[1]]["sha256"])' "${{ matrix.app }}")
          actual=$(keytool -exportcert -rfc -alias "$ZAVI_KEY_ALIAS" -keystore "$target" -storepass "$ZAVI_STORE_PASSWORD" |
            openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Public, pinned certificate SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::A different signing certificate was supplied; refusing an unupdatable APK."
            exit 1
          fi
          {
            echo "ZAVI_QA_STORE_FILE=$target"
            echo "ZAVI_QA_STORE_PASSWORD=$ZAVI_STORE_PASSWORD"
            echo "ZAVI_QA_KEY_ALIAS=$ZAVI_KEY_ALIAS"
            echo "ZAVI_QA_KEY_PASSWORD=$ZAVI_KEY_PASSWORD"
            echo "ZAVI_QA_SIGNING_MODE=stable"
            echo "ZAVI_QA_EXPECTED_CERT_SHA256=$expected"
          } >> "$GITHUB_ENV"
          echo "PASS: persistent certificate matches the pinned ${{ matrix.app }} identity"
      - name: Stage app and shared assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          cp -a "apps/${{ matrix.app }}/." android-build/app/src/main/assets/
          mkdir -p android-build/app/src/main/assets/packages/shared
          cp -a packages/shared/. android-build/app/src/main/assets/packages/shared/ || true
          for shared_file in database/supabase-config.js security/access-contract.js i18n/language-core.js; do
            mkdir -p "android-build/app/src/main/assets/packages/shared/$(dirname "$shared_file")"
            cp "packages/shared/$shared_file" "android-build/app/src/main/assets/packages/shared/$shared_file"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          # The app source may already use the packaged path or the web-host path.
          s=s.replace('../../packages/shared/','./packages/shared/')
          s=s.replace('../packages/shared/','./packages/shared/')
          p.write_text(s,encoding='utf-8')
          print('staged shared modules:', list((Path('android-build/app/src/main/assets/packages/shared')).rglob('*'))[:20])
          PY
          if [[ "${{ matrix.app }}" == "one" ]]; then
            version="66.78-reborn.qa.$GITHUB_RUN_NUMBER"
            package="com.zavione.one.rebornqa"
          else
            version="1.4.69-reborn.qa.$GITHUB_RUN_NUMBER"
            package="com.zavione.one.admin.rebornqa"
          fi
          printf '{"commit":"%s","app":"%s","run":"%s","version":"%s","package":"%s","kind":"debug-qa","signing":"%s"}\n' \
            "$GITHUB_SHA" "${{ matrix.app }}" "$GITHUB_RUN_NUMBER" "$version" "$package" "$ZAVI_QA_SIGNING_MODE" \
            > android-build/app/src/main/assets/zavi-build-info.json
          test -s android-build/app/src/main/assets/zavi-build-info.json
          python3 scripts/stamp-qa-version.py \
            --app "${{ matrix.app }}" --run "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" \
            --signing "$ZAVI_QA_SIGNING_MODE" --assets android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/res/drawable-nodpi android-build/app/src/main/res/values android-build/app/src/main/res/xml
          cp "apps/${{ matrix.app }}/icon-192.png" android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.png
          printf '%s\n' '<resources><style name="ZaviTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:windowLightStatusBar">false</item></style></resources>' > android-build/app/src/main/res/values/styles.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="camera" path="."/></paths>' > android-build/app/src/main/res/xml/zavi_camera_paths.xml
      - name: Validate WebView source
        run: |
          python3 scripts/fix-webview-receipt.py
          python3 scripts/validate-webview-html.py
      - name: Clean Android build outputs
        run: ./gradlew :app:clean -PzaviApp=${{ matrix.app }} -PzaviBuildNumber=${{ github.run_number }} --no-build-cache
      - name: Assemble QA APK
        run: ./gradlew :app:assembleDebug -PzaviApp=${{ matrix.app }} -PzaviBuildNumber=${{ github.run_number }} --stacktrace
      - name: Check optimized Release compilation (unsigned, never distributed)
        shell: bash
        run: |
          set -euo pipefail
          # Exercise R8, resource shrinking and the actual release build type.
          # This test artifact is deliberately UNSIGNED and must not be uploaded.
          ./gradlew :app:assembleRelease \
            -PzaviApp=${{ matrix.app }} \
            -PzaviBuildNumber=${{ github.run_number }} \
            -PzaviUnsignedReleaseQa=true --no-build-cache --stacktrace
          unsigned=$(find android-build/app/build/outputs/apk/release -maxdepth 1 \
            -type f -name '*unsigned.apk' -print -quit)
          test -n "$unsigned"
          unzip -t "$unsigned" >/dev/null
          echo "PASS: R8-optimized unsigned release compilation (not installable, not published)"
      - name: Verify unique identity, commit provenance and PDF assets
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android-build/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -p "$apk" assets/zavi-build-info.json | grep -F "$GITHUB_SHA"
          python3 scripts/stamp-qa-version.py \
            --app "${{ matrix.app }}" --run "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" \
            --signing "$ZAVI_QA_SIGNING_MODE" --apk "$apk"
          if [[ "${{ matrix.app }}" == "one" ]]; then
            unzip -l "$apk" | grep -F 'assets/zavi-pdf-final-v6760.css'
          else
            unzip -l "$apk" | grep -F 'assets/zavi-admin-pdf-final-v1467.css'
          fi
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test "$ZAVI_QA_SIGNING_MODE" = stable
          test -n "$ZAVI_QA_EXPECTED_CERT_SHA256"
          python3 scripts/verify-apk-update.py --app "${{ matrix.app }}" --mode qa \
            --apk "$apk" --aapt "$AAPT" --apksigner "$APKSIGNER" \
            --expected-sha256 "$ZAVI_QA_EXPECTED_CERT_SHA256"
          signer_report=$("$APKSIGNER" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signer_report"
          for scheme in "v1 scheme" "v2 scheme" "v3 scheme"; do
            printf '%s\n' "$signer_report" | grep -E "Verified using $scheme.*: true" >/dev/null || {
              echo "::error::Required signing scheme $scheme failed verification"; exit 1;
            }
          done
          printf '%s\n' "$signer_report" | grep -Fi "$ZAVI_QA_EXPECTED_CERT_SHA256" >/dev/null || {
            echo "::error::Signer does not match pinned fingerprint"; exit 1;
          }
          badging=$("$AAPT" dump badging "$apk")
          printf '%s\\n' "$badging"
          # Android 8.0 (API 26) through Android 16 (API 36) build contract.
          printf '%s\\n' "$badging" | grep -F "sdkVersion:'26'"
          printf '%s\\n' "$badging" | grep -F "targetSdkVersion:'36'"
          if [[ "${{ matrix.app }}" == "one" ]]; then
            printf '%s\\n' "$badging" | grep -F "package: name='com.zavione.one.rebornqa'"
            printf '%s\\n' "$badging" | grep -F "versionName='66.78-reborn.qa.${{ github.run_number }}'"
          else
            printf '%s\\n' "$badging" | grep -F "package: name='com.zavione.one.admin.rebornqa'"
            printf '%s\\n' "$badging" | grep -F "versionName='1.4.69-reborn.qa.${{ github.run_number }}'"
          fi
          mkdir -p final-apks
          if [[ "${{ matrix.app }}" == "one" ]]; then
            cp "$apk" final-apks/ZAVI_ONE_REBORN_QA.apk
          else
            cp "$apk" final-apks/ZAVI_ONE_ADMIN_REBORN_QA.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI-ONE-REBORN-QA-${{ matrix.app }}
          path: final-apks/*.apk
          if-no-files-found: error
          retention-days: 14

# Public-repository QA build: signatures are mandatory, never upload debug-signed APKs.
